<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pixel Editor</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --bg-base: #0a0a0b;
            --bg-elevated: #111113;
            --bg-surface: #18181b;
            --bg-hover: rgba(255,255,255,0.04);
            --border: rgba(255,255,255,0.06);
            --text-muted: #71717a;
            --text-dim: #52525b;
            --text-normal: #a1a1aa;
            --text-bright: #e4e4e7;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-base);
            color: var(--text-normal);
            font-size: 13px;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: #3f3f46; }

        /* Canvas container */
        .canvas-wrapper {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-base);
            background-image:
                linear-gradient(45deg, #151517 25%, transparent 25%),
                linear-gradient(-45deg, #151517 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #151517 75%),
                linear-gradient(-45deg, transparent 75%, #151517 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
            overflow: hidden;
            position: relative;
        }

        #pixel-canvas {
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            cursor: crosshair;
            box-shadow: 0 0 40px rgba(0,0,0,0.5);
        }

        /* Tool buttons */
        .tool-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 36px;
            height: 36px;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            transition: all 0.15s ease;
            border: 1px solid transparent;
        }
        .tool-btn:hover {
            color: var(--text-normal);
            background: var(--bg-hover);
        }
        .tool-btn.active {
            color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.3);
        }

        /* Color swatch */
        .color-swatch {
            width: 24px;
            height: 24px;
            border-radius: 4px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all 0.1s ease;
        }
        .color-swatch:hover {
            transform: scale(1.1);
        }
        .color-swatch.active {
            border-color: white;
            box-shadow: 0 0 0 2px var(--bg-base), 0 0 0 4px var(--accent);
        }

        /* Layer item */
        .layer-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.1s ease;
            border: 1px solid transparent;
        }
        .layer-item:hover {
            background: var(--bg-hover);
        }
        .layer-item.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: rgba(59, 130, 246, 0.2);
        }

        .layer-preview {
            width: 32px;
            height: 32px;
            border-radius: 4px;
            background: var(--bg-surface);
            image-rendering: pixelated;
        }

        /* Panel header */
        .panel-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 14px;
            font-size: 11px;
            font-weight: 500;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid var(--border);
        }

        /* Icon button */
        .icon-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 6px;
            color: var(--text-dim);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.1s ease;
        }
        .icon-btn:hover {
            color: var(--text-normal);
            background: var(--bg-hover);
        }

        /* Slider */
        input[type="range"] {
            -webkit-appearance: none;
            width: 100%;
            height: 4px;
            background: var(--bg-surface);
            border-radius: 2px;
            outline: none;
        }
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 12px;
            background: var(--text-normal);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.1s ease;
        }
        input[type="range"]::-webkit-slider-thumb:hover {
            background: var(--text-bright);
            transform: scale(1.1);
        }

        /* Main action button */
        .action-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 8px 16px;
            background: var(--accent);
            border: none;
            border-radius: 6px;
            font-size: 12px;
            font-weight: 500;
            color: white;
            cursor: pointer;
            transition: all 0.15s ease;
        }
        .action-btn:hover {
            background: var(--accent-hover);
        }

        /* Status indicator */
        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-dim);
        }
        .status-dot.online { background: #22c55e; }
        .status-dot.working { background: #f59e0b; animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Tooltip */
        [data-tooltip] {
            position: relative;
        }
        [data-tooltip]:hover::after {
            content: attr(data-tooltip);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%);
            padding: 6px 10px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 11px;
            color: var(--text-bright);
            white-space: nowrap;
            z-index: 100;
            margin-bottom: 6px;
        }

        /* Number input */
        .num-input {
            width: 60px;
            padding: 6px 8px;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 11px;
            color: var(--text-bright);
            text-align: center;
            outline: none;
        }
        .num-input:focus {
            border-color: var(--accent);
        }

        /* Context menu */
        .ctx-menu {
            position: fixed;
            background: var(--bg-surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 16px 48px rgba(0,0,0,0.4);
            padding: 6px;
            min-width: 180px;
            z-index: 1000;
        }
        .ctx-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            font-size: 12px;
            color: var(--text-normal);
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.1s ease;
        }
        .ctx-item:hover {
            background: var(--bg-hover);
            color: var(--text-bright);
        }
        .ctx-key {
            margin-left: auto;
            font-size: 10px;
            color: var(--text-dim);
            font-family: 'JetBrains Mono', monospace;
        }
        .ctx-sep {
            height: 1px;
            background: var(--border);
            margin: 4px 0;
        }

        /* Divider */
        .divider {
            width: 1px;
            height: 20px;
            background: var(--border);
            margin: 0 8px;
        }

        /* Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }
        .modal {
            background: var(--bg-elevated);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 24px;
            min-width: 320px;
            box-shadow: 0 24px 64px rgba(0,0,0,0.5);
        }
        .modal-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-bright);
            margin-bottom: 16px;
        }
    </style>
</head>
<body class="h-screen flex flex-col overflow-hidden">

    <!-- Header -->
    <header class="h-12 flex items-center justify-between px-4 bg-[var(--bg-elevated)] border-b border-[var(--border)]">
        <div class="flex items-center gap-4">
            <div class="flex items-center gap-2">
                <i data-lucide="box" class="w-5 h-5 text-[var(--accent)]"></i>
                <span class="font-semibold text-[var(--text-bright)]">Pixel Editor</span>
            </div>
            <div class="divider"></div>
            <div class="flex items-center gap-2">
                <span id="status-dot" class="status-dot online"></span>
                <span id="project-name" class="text-sm text-[var(--text-muted)]">Untitled</span>
            </div>
        </div>
        <div class="flex items-center gap-3">
            <span id="canvas-info" class="text-xs text-[var(--text-dim)] font-mono">32 x 32</span>
            <span id="cursor-pos" class="text-xs text-[var(--text-dim)] font-mono">0, 0</span>
            <div class="divider"></div>
            <button onclick="exportImage()" class="action-btn">
                <i data-lucide="download" class="w-4 h-4"></i>
                Export
            </button>
        </div>
    </header>

    <div class="flex-1 flex overflow-hidden">
        <!-- Tools Sidebar -->
        <aside class="w-14 bg-[var(--bg-elevated)] border-r border-[var(--border)] flex flex-col items-center py-3 gap-1">
            <button class="tool-btn active" data-tool="pencil" data-tooltip="Pencil (B)">
                <i data-lucide="pencil" class="w-4 h-4"></i>
            </button>
            <button class="tool-btn" data-tool="eraser" data-tooltip="Eraser (E)">
                <i data-lucide="eraser" class="w-4 h-4"></i>
            </button>
            <button class="tool-btn" data-tool="bucket" data-tooltip="Fill (G)">
                <i data-lucide="paint-bucket" class="w-4 h-4"></i>
            </button>
            <button class="tool-btn" data-tool="picker" data-tooltip="Color Picker (I)">
                <i data-lucide="pipette" class="w-4 h-4"></i>
            </button>
            <div class="w-6 h-px bg-[var(--border)] my-2"></div>
            <button class="tool-btn" data-tool="line" data-tooltip="Line (L)">
                <i data-lucide="minus" class="w-4 h-4"></i>
            </button>
            <button class="tool-btn" data-tool="rect" data-tooltip="Rectangle (R)">
                <i data-lucide="square" class="w-4 h-4"></i>
            </button>
            <button class="tool-btn" data-tool="ellipse" data-tooltip="Ellipse (O)">
                <i data-lucide="circle" class="w-4 h-4"></i>
            </button>
            <div class="w-6 h-px bg-[var(--border)] my-2"></div>
            <button class="tool-btn" data-tool="select" data-tooltip="Select (M)">
                <i data-lucide="box-select" class="w-4 h-4"></i>
            </button>
            <button class="tool-btn" data-tool="move" data-tooltip="Move (V)">
                <i data-lucide="move" class="w-4 h-4"></i>
            </button>
            <div class="flex-1"></div>
            <button class="tool-btn" onclick="toggleGrid()" data-tooltip="Toggle Grid">
                <i data-lucide="grid-3x3" class="w-4 h-4"></i>
            </button>
            <button class="tool-btn" onclick="zoomIn()" data-tooltip="Zoom In">
                <i data-lucide="zoom-in" class="w-4 h-4"></i>
            </button>
            <button class="tool-btn" onclick="zoomOut()" data-tooltip="Zoom Out">
                <i data-lucide="zoom-out" class="w-4 h-4"></i>
            </button>
        </aside>

        <!-- Main Canvas Area -->
        <main class="flex-1 flex flex-col">
            <!-- Secondary toolbar -->
            <div class="h-10 flex items-center gap-4 px-4 bg-[var(--bg-surface)] border-b border-[var(--border)]">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-[var(--text-dim)]">Size</span>
                    <input type="range" id="brush-size" min="1" max="16" value="1" class="w-20" oninput="updateBrushSize(this.value)">
                    <span id="brush-size-val" class="text-xs text-[var(--text-muted)] font-mono w-4">1</span>
                </div>
                <div class="divider"></div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-[var(--text-dim)]">Opacity</span>
                    <input type="range" id="opacity" min="0" max="100" value="100" class="w-20">
                    <span id="opacity-val" class="text-xs text-[var(--text-muted)] font-mono w-8">100%</span>
                </div>
                <div class="flex-1"></div>
                <button class="icon-btn" onclick="undo()" data-tooltip="Undo">
                    <i data-lucide="undo-2" class="w-4 h-4"></i>
                </button>
                <button class="icon-btn" onclick="redo()" data-tooltip="Redo">
                    <i data-lucide="redo-2" class="w-4 h-4"></i>
                </button>
            </div>

            <!-- Canvas -->
            <div class="flex-1 canvas-wrapper" id="canvas-container">
                <canvas id="pixel-canvas"></canvas>
            </div>

            <!-- Timeline (for animation) -->
            <div class="h-16 flex items-center gap-2 px-4 bg-[var(--bg-surface)] border-t border-[var(--border)]">
                <button class="icon-btn">
                    <i data-lucide="skip-back" class="w-4 h-4"></i>
                </button>
                <button class="icon-btn" id="play-btn">
                    <i data-lucide="play" class="w-4 h-4"></i>
                </button>
                <button class="icon-btn">
                    <i data-lucide="skip-forward" class="w-4 h-4"></i>
                </button>
                <div class="divider"></div>
                <div class="flex-1 flex items-center gap-2 overflow-x-auto py-2" id="frames-container">
                    <div class="w-12 h-12 rounded bg-[var(--bg-elevated)] border-2 border-[var(--accent)] flex items-center justify-center text-xs text-[var(--text-muted)]">1</div>
                    <button class="w-12 h-12 rounded border border-dashed border-[var(--border)] flex items-center justify-center text-[var(--text-dim)] hover:border-[var(--text-dim)] transition-colors">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                    </button>
                </div>
                <div class="divider"></div>
                <div class="flex items-center gap-2">
                    <span class="text-xs text-[var(--text-dim)]">FPS</span>
                    <input type="number" value="12" class="num-input w-12">
                </div>
            </div>
        </main>

        <!-- Right Sidebar: Colors & Layers -->
        <aside class="w-60 bg-[var(--bg-elevated)] border-l border-[var(--border)] flex flex-col">
            <!-- Color Picker -->
            <div class="border-b border-[var(--border)]">
                <div class="panel-header">
                    <span>Color</span>
                </div>
                <div class="p-4">
                    <div class="flex items-center gap-3 mb-4">
                        <div class="relative">
                            <div id="primary-color" class="w-10 h-10 rounded-lg cursor-pointer" style="background: #ffffff;"></div>
                            <div id="secondary-color" class="w-6 h-6 rounded absolute -bottom-1 -right-1 border-2 border-[var(--bg-elevated)] cursor-pointer" style="background: #000000;"></div>
                        </div>
                        <div class="flex-1">
                            <input type="text" id="color-hex" value="#FFFFFF" class="num-input w-full text-left" oninput="updateColorFromHex(this.value)">
                        </div>
                    </div>
                </div>
            </div>

            <!-- Palette -->
            <div class="border-b border-[var(--border)]">
                <div class="panel-header">
                    <span>Palette</span>
                    <button class="icon-btn">
                        <i data-lucide="plus" class="w-3 h-3"></i>
                    </button>
                </div>
                <div class="p-3">
                    <div id="palette" class="grid grid-cols-8 gap-1">
                        <!-- Palette colors will be inserted here -->
                    </div>
                </div>
            </div>

            <!-- Layers -->
            <div class="flex-1 flex flex-col min-h-0">
                <div class="panel-header">
                    <span>Layers</span>
                    <div class="flex items-center gap-1">
                        <button class="icon-btn" onclick="addLayer()">
                            <i data-lucide="plus" class="w-3 h-3"></i>
                        </button>
                        <button class="icon-btn" onclick="deleteLayer()">
                            <i data-lucide="trash-2" class="w-3 h-3"></i>
                        </button>
                    </div>
                </div>
                <div id="layers-list" class="flex-1 overflow-y-auto p-2 flex flex-col gap-1">
                    <!-- Layers will be inserted here -->
                </div>
            </div>

            <!-- Layer opacity -->
            <div class="p-3 border-t border-[var(--border)]">
                <div class="flex items-center gap-2">
                    <span class="text-xs text-[var(--text-dim)]">Opacity</span>
                    <input type="range" id="layer-opacity" min="0" max="100" value="100" class="flex-1">
                    <span class="text-xs text-[var(--text-muted)] font-mono w-8">100%</span>
                </div>
            </div>
        </aside>
    </div>

    <!-- Status Bar -->
    <footer class="h-7 flex items-center justify-between px-4 bg-[var(--bg-surface)] border-t border-[var(--border)] text-xs text-[var(--text-dim)]">
        <div class="flex items-center gap-4">
            <span id="tool-info">Pencil Tool</span>
            <span>|</span>
            <span id="zoom-level">Zoom: 800%</span>
        </div>
        <div class="flex items-center gap-4">
            <span id="memory-usage">Memory: 0.5 MB</span>
            <span>|</span>
            <span>Bun + TypeScript</span>
        </div>
    </footer>

    <!-- Context Menu (hidden by default) -->
    <div id="context-menu" class="ctx-menu hidden">
        <div class="ctx-item" onclick="undo()">
            <i data-lucide="undo-2" class="w-4 h-4"></i>Undo<span class="ctx-key">Ctrl+Z</span>
        </div>
        <div class="ctx-item" onclick="redo()">
            <i data-lucide="redo-2" class="w-4 h-4"></i>Redo<span class="ctx-key">Ctrl+Y</span>
        </div>
        <div class="ctx-sep"></div>
        <div class="ctx-item" onclick="copySelection()">
            <i data-lucide="copy" class="w-4 h-4"></i>Copy<span class="ctx-key">Ctrl+C</span>
        </div>
        <div class="ctx-item" onclick="pasteSelection()">
            <i data-lucide="clipboard" class="w-4 h-4"></i>Paste<span class="ctx-key">Ctrl+V</span>
        </div>
        <div class="ctx-sep"></div>
        <div class="ctx-item" onclick="clearCanvas()">
            <i data-lucide="trash-2" class="w-4 h-4"></i>Clear Canvas
        </div>
    </div>

    <script>
        // Initialize Lucide icons
        lucide.createIcons();

        // State
        const state = {
            canvas: null,
            ctx: null,
            width: 32,
            height: 32,
            zoom: 8,
            currentTool: 'pencil',
            primaryColor: '#ffffff',
            secondaryColor: '#000000',
            brushSize: 1,
            isDrawing: false,
            layers: [],
            currentLayer: 0,
            history: [],
            historyIndex: -1,
            showGrid: true,
        };

        // Default palette
        const defaultPalette = [
            '#000000', '#1d2b53', '#7e2553', '#008751',
            '#ab5236', '#5f574f', '#c2c3c7', '#fff1e8',
            '#ff004d', '#ffa300', '#ffec27', '#00e436',
            '#29adff', '#83769c', '#ff77a8', '#ffccaa',
        ];

        // Initialize
        function init() {
            state.canvas = document.getElementById('pixel-canvas');
            state.ctx = state.canvas.getContext('2d');

            resizeCanvas();
            initPalette();
            initLayers();
            setupEventListeners();
            render();
        }

        function resizeCanvas() {
            state.canvas.width = state.width;
            state.canvas.height = state.height;
            state.canvas.style.width = `${state.width * state.zoom}px`;
            state.canvas.style.height = `${state.height * state.zoom}px`;
            document.getElementById('canvas-info').textContent = `${state.width} x ${state.height}`;
            document.getElementById('zoom-level').textContent = `Zoom: ${state.zoom * 100}%`;
        }

        function initPalette() {
            const paletteContainer = document.getElementById('palette');
            paletteContainer.innerHTML = defaultPalette.map((color, i) =>
                `<div class="color-swatch ${i === 0 ? 'active' : ''}"
                     style="background: ${color};"
                     data-color="${color}"
                     onclick="selectColor('${color}', this)"></div>`
            ).join('');
        }

        function initLayers() {
            state.layers = [{
                id: 1,
                name: 'Layer 1',
                visible: true,
                opacity: 1,
                data: new ImageData(state.width, state.height)
            }];
            renderLayers();
        }

        function renderLayers() {
            const container = document.getElementById('layers-list');
            container.innerHTML = state.layers.map((layer, i) => `
                <div class="layer-item ${i === state.currentLayer ? 'active' : ''}" onclick="selectLayer(${i})">
                    <button class="icon-btn" onclick="toggleLayerVisibility(${i}, event)">
                        <i data-lucide="${layer.visible ? 'eye' : 'eye-off'}" class="w-3 h-3"></i>
                    </button>
                    <div class="layer-preview"></div>
                    <span class="text-sm flex-1">${layer.name}</span>
                </div>
            `).reverse().join('');
            lucide.createIcons();
        }

        function selectLayer(index) {
            state.currentLayer = index;
            renderLayers();
        }

        function addLayer() {
            const id = state.layers.length + 1;
            state.layers.push({
                id,
                name: `Layer ${id}`,
                visible: true,
                opacity: 1,
                data: new ImageData(state.width, state.height)
            });
            state.currentLayer = state.layers.length - 1;
            renderLayers();
        }

        function deleteLayer() {
            if (state.layers.length > 1) {
                state.layers.splice(state.currentLayer, 1);
                state.currentLayer = Math.min(state.currentLayer, state.layers.length - 1);
                renderLayers();
                render();
            }
        }

        function toggleLayerVisibility(index, e) {
            e.stopPropagation();
            state.layers[index].visible = !state.layers[index].visible;
            renderLayers();
            render();
        }

        function selectColor(color, element) {
            state.primaryColor = color;
            document.getElementById('primary-color').style.background = color;
            document.getElementById('color-hex').value = color.toUpperCase();
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.remove('active'));
            if (element) element.classList.add('active');
        }

        function updateColorFromHex(hex) {
            if (/^#[0-9A-Fa-f]{6}$/.test(hex)) {
                selectColor(hex.toLowerCase());
            }
        }

        function setupEventListeners() {
            const canvas = state.canvas;

            // Tool selection
            document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
                btn.addEventListener('click', () => {
                    document.querySelectorAll('.tool-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    state.currentTool = btn.dataset.tool;
                    document.getElementById('tool-info').textContent =
                        btn.dataset.tool.charAt(0).toUpperCase() + btn.dataset.tool.slice(1) + ' Tool';
                });
            });

            // Canvas events
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('mouseleave', stopDrawing);
            canvas.addEventListener('mousemove', updateCursorPos);

            // Context menu
            canvas.addEventListener('contextmenu', (e) => {
                e.preventDefault();
                const menu = document.getElementById('context-menu');
                menu.style.left = e.pageX + 'px';
                menu.style.top = e.pageY + 'px';
                menu.classList.remove('hidden');
            });

            document.addEventListener('click', () => {
                document.getElementById('context-menu').classList.add('hidden');
            });

            // Keyboard shortcuts
            document.addEventListener('keydown', handleKeyboard);

            // Brush size
            document.getElementById('brush-size').addEventListener('input', (e) => {
                state.brushSize = parseInt(e.target.value);
                document.getElementById('brush-size-val').textContent = state.brushSize;
            });

            // Opacity
            document.getElementById('opacity').addEventListener('input', (e) => {
                document.getElementById('opacity-val').textContent = e.target.value + '%';
            });
        }

        function getCanvasPos(e) {
            const rect = state.canvas.getBoundingClientRect();
            return {
                x: Math.floor((e.clientX - rect.left) / state.zoom),
                y: Math.floor((e.clientY - rect.top) / state.zoom)
            };
        }

        function updateCursorPos(e) {
            const pos = getCanvasPos(e);
            document.getElementById('cursor-pos').textContent = `${pos.x}, ${pos.y}`;
        }

        function startDrawing(e) {
            if (e.button !== 0) return;
            state.isDrawing = true;
            saveState();
            draw(e);
        }

        function draw(e) {
            if (!state.isDrawing) return;

            const pos = getCanvasPos(e);
            const layer = state.layers[state.currentLayer];
            if (!layer.visible) return;

            const color = state.currentTool === 'eraser' ? 'rgba(0,0,0,0)' : state.primaryColor;

            switch (state.currentTool) {
                case 'pencil':
                case 'eraser':
                    drawPixel(pos.x, pos.y, color);
                    break;
                case 'bucket':
                    floodFill(pos.x, pos.y, color);
                    break;
                case 'picker':
                    pickColor(pos.x, pos.y);
                    break;
            }

            render();
        }

        function stopDrawing() {
            state.isDrawing = false;
        }

        function drawPixel(x, y, color) {
            if (x < 0 || x >= state.width || y < 0 || y >= state.height) return;

            state.ctx.fillStyle = color;

            const size = state.brushSize;
            const offset = Math.floor(size / 2);

            for (let dx = 0; dx < size; dx++) {
                for (let dy = 0; dy < size; dy++) {
                    const px = x - offset + dx;
                    const py = y - offset + dy;
                    if (px >= 0 && px < state.width && py >= 0 && py < state.height) {
                        if (state.currentTool === 'eraser') {
                            state.ctx.clearRect(px, py, 1, 1);
                        } else {
                            state.ctx.fillRect(px, py, 1, 1);
                        }
                    }
                }
            }
        }

        function floodFill(x, y, fillColor) {
            const imageData = state.ctx.getImageData(0, 0, state.width, state.height);
            const data = imageData.data;

            const targetColor = getPixelColor(data, x, y);
            const fill = hexToRgb(fillColor);

            if (colorsMatch(targetColor, fill)) return;

            const stack = [[x, y]];
            const visited = new Set();

            while (stack.length > 0) {
                const [cx, cy] = stack.pop();
                const key = `${cx},${cy}`;

                if (visited.has(key)) continue;
                if (cx < 0 || cx >= state.width || cy < 0 || cy >= state.height) continue;

                const currentColor = getPixelColor(data, cx, cy);
                if (!colorsMatch(currentColor, targetColor)) continue;

                visited.add(key);
                setPixelColor(data, cx, cy, fill);

                stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
            }

            state.ctx.putImageData(imageData, 0, 0);
        }

        function pickColor(x, y) {
            const imageData = state.ctx.getImageData(x, y, 1, 1);
            const [r, g, b] = imageData.data;
            const hex = `#${r.toString(16).padStart(2, '0')}${g.toString(16).padStart(2, '0')}${b.toString(16).padStart(2, '0')}`;
            selectColor(hex);
        }

        function getPixelColor(data, x, y) {
            const i = (y * state.width + x) * 4;
            return { r: data[i], g: data[i+1], b: data[i+2], a: data[i+3] };
        }

        function setPixelColor(data, x, y, color) {
            const i = (y * state.width + x) * 4;
            data[i] = color.r;
            data[i+1] = color.g;
            data[i+2] = color.b;
            data[i+3] = 255;
        }

        function colorsMatch(c1, c2, tolerance = 0) {
            return Math.abs(c1.r - c2.r) <= tolerance &&
                   Math.abs(c1.g - c2.g) <= tolerance &&
                   Math.abs(c1.b - c2.b) <= tolerance;
        }

        function hexToRgb(hex) {
            const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
            return result ? {
                r: parseInt(result[1], 16),
                g: parseInt(result[2], 16),
                b: parseInt(result[3], 16)
            } : { r: 0, g: 0, b: 0 };
        }

        function render() {
            // For now, grid rendering is handled in CSS
            // This function would composite all layers
        }

        function toggleGrid() {
            state.showGrid = !state.showGrid;
            // Toggle grid overlay
        }

        function zoomIn() {
            if (state.zoom < 32) {
                state.zoom *= 2;
                resizeCanvas();
            }
        }

        function zoomOut() {
            if (state.zoom > 1) {
                state.zoom /= 2;
                resizeCanvas();
            }
        }

        function updateBrushSize(val) {
            state.brushSize = parseInt(val);
            document.getElementById('brush-size-val').textContent = val;
        }

        // History (Undo/Redo)
        function saveState() {
            const imageData = state.ctx.getImageData(0, 0, state.width, state.height);
            state.history = state.history.slice(0, state.historyIndex + 1);
            state.history.push(imageData);
            state.historyIndex++;
            if (state.history.length > 50) {
                state.history.shift();
                state.historyIndex--;
            }
        }

        function undo() {
            if (state.historyIndex > 0) {
                state.historyIndex--;
                state.ctx.putImageData(state.history[state.historyIndex], 0, 0);
            }
        }

        function redo() {
            if (state.historyIndex < state.history.length - 1) {
                state.historyIndex++;
                state.ctx.putImageData(state.history[state.historyIndex], 0, 0);
            }
        }

        function clearCanvas() {
            saveState();
            state.ctx.clearRect(0, 0, state.width, state.height);
        }

        function copySelection() {
            // Placeholder
        }

        function pasteSelection() {
            // Placeholder
        }

        function exportImage() {
            const link = document.createElement('a');
            link.download = 'pixel-art.png';
            link.href = state.canvas.toDataURL('image/png');
            link.click();
        }

        // Keyboard shortcuts
        function handleKeyboard(e) {
            if (e.target.tagName === 'INPUT') return;

            const shortcuts = {
                'b': 'pencil',
                'e': 'eraser',
                'g': 'bucket',
                'i': 'picker',
                'l': 'line',
                'r': 'rect',
                'o': 'ellipse',
                'm': 'select',
                'v': 'move'
            };

            if (shortcuts[e.key]) {
                const btn = document.querySelector(`[data-tool="${shortcuts[e.key]}"]`);
                if (btn) btn.click();
            }

            if (e.ctrlKey || e.metaKey) {
                if (e.key === 'z') {
                    e.preventDefault();
                    undo();
                } else if (e.key === 'y') {
                    e.preventDefault();
                    redo();
                } else if (e.key === 's') {
                    e.preventDefault();
                    exportImage();
                }
            }

            if (e.key === '+' || e.key === '=') zoomIn();
            if (e.key === '-') zoomOut();
        }

        // Initialize when DOM is ready
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
